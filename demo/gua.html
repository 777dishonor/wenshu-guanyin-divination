<!DOCTYPE html>
<html lang="zh-CN"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 文殊卦象 · v0.3 视觉
     段落顺序严格照原文：卦名 → 偈颂 → 本体 → 标记 → 分项 → 禳解 → 判词 → 注。
     原文在禳解/判词/注前面没有任何小标题，所以一个都不加 —— 加标题就是往原文里塞字。
     全页正文一律 14，唯一的分层点是卦名；靠字重、绛红栏名、注的顶线与墨灰区分功能，不靠字号。
     标记（「表示三解脱空性之声。」）是偈颂的下半句，字号与颜色都必须和偈颂完全一致。
     分项一律 label + sep + text 原样拼回。sep 是原文的「：」或「，」，
     36 卦里有 36 条用逗号（每卦末条「若问其他诸事，则…」），丢了就是改标点。 -->
<title>文殊卦象</title>
<style>
@font-face{font-family:Tibetan;src:url(../assets/tibetan.woff2) format("woff2");font-display:swap}
:root{
  --bg:#F7F7F5; --card:#FFFFFF;
  --ink:#1B1B1A; --ink2:#666662; --slate:#56564F;
  --zhu:#A33E2C; --line:#E5E5E1;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --tib:"Tibetan","Noto Serif Tibetan","Microsoft Himalaya",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:2px solid var(--zhu); outline-offset:2px; border-radius:3px}
html{overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.7 var(--sans); letter-spacing:.02em;
  max-width:420px; margin:0 auto; padding:0 20px calc(32px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* 顶栏：与首页、仪轨、所问、掷骰同一个 13/500 */
.bar{display:flex; align-items:center; gap:13px; height:52px;
  border-bottom:1px solid var(--line);
  font:500 13px/1.4 var(--sans); letter-spacing:.02em}
.back{flex:1; display:flex; align-items:center; gap:3px;
  color:var(--ink2); text-decoration:none}
.back i{font-style:normal; font-size:16px; line-height:1; margin-top:-2px}
.bar .tr{color:var(--ink)}

/* 所问：用户自己的问题，摆在卦名前，方便对照。没有问题就不出这一行 */
.ask{margin-top:18px; font-size:14px; line-height:1.65; color:var(--ink2);
  text-align:justify; text-justify:inter-ideograph}
.ask b{font:500 14px/1 var(--sans); letter-spacing:.1em; color:var(--slate);
  margin-right:9px}

/* 卦名一行三件：汉语 → 藏语 → 方位。藏文字身远小于汉字，34 才和 26 的汉字等重 */
.nm{display:flex; flex-wrap:wrap; align-items:baseline; gap:11px; margin-top:16px;
  font:500 26px/1.3 var(--sans); letter-spacing:.02em}
.nm .ti{font:400 34px/1.7 var(--tib); white-space:nowrap; flex:none; letter-spacing:0}
.nm .dir{font:400 14px/1.4 var(--sans); color:var(--slate); white-space:nowrap}

/* 正文一律 14，一号到底：偈颂、标记、分项、禳解、判词、注全同号。
   原先 17/14 两级，同一页里读起来像两套体系 —— 这一页的字号分层只留一处：卦名 */
.lead,.vd,.mk,.rm,.s,.nt{font-size:14px; line-height:1.75;
  text-align:justify; text-justify:inter-ideograph; text-wrap:pretty}
/* 占两次：卦名上方一枚小标说明「下面是第一遍」，第二遍与结论另起一块。
   原文只给了判法（同名可肯定 / 佛父佛母颠倒重占 / 不同再占一次），吉凶不替用户判 */
.tag{margin-top:16px; font:600 11px/1 var(--sans); letter-spacing:.16em; color:var(--slate)}
.two{margin-top:14px; padding:11px 13px; background:var(--card);
  border:1px solid var(--line); border-radius:10px; font-size:13px; line-height:1.7}
.two b{font-weight:600; color:var(--slate); letter-spacing:.06em; margin-right:9px}
/* 两卦之间：一条线 + 一枚小标，把「第二次卦象」的正文与第一卦分开 */
.sep{margin-top:34px; padding-top:13px; border-top:1px solid var(--line)}
.sep span{font:600 11px/1 var(--sans); letter-spacing:.16em; color:var(--slate)}
.two .r{margin-top:7px; padding-top:7px; border-top:1px solid var(--line); color:var(--ink)}

.lead{margin-top:20px; white-space:pre-line}
/* 标记是偈颂的下半句（「…自心安住于圆满清净等舍。／表示三解脱空性之声。」），
   只是换行，不是换级：字号、颜色、行高全部继承上面的 .lead，只有段距小一点 */
.mk{margin-top:6px}
.s{margin-top:9px}
.s b{font-weight:600; color:var(--zhu)}
.rm{margin-top:22px; white-space:pre-line}
.vd{margin-top:18px; font-weight:500}
/* 注：原文用「>」引出的词条。不写「注」两个字 —— 那条线就是标题 */
.nt{margin-top:24px; padding-top:11px; border-top:1px solid var(--line); color:var(--ink2)}
.nt p+p{margin-top:5px}

/* 回首页：这一页没有别的出口，顶栏的「返回」只回到掷骰 */
.home{display:flex; align-items:center; justify-content:center; height:46px; margin-top:34px;
  border:1px solid var(--line); border-radius:10px; background:var(--card);
  font:500 14px/1 var(--sans); color:var(--ink); text-decoration:none}
.home:hover{border-color:var(--slate)}
</style>

</header>

：","text":"无有怨敌。"},{"label":"行旅之人","sep":"：","text":"一帆风顺，很快会携带佳音回转。"},{"label":"疾病","sep":"：","text":"病痛迅疾息灭，无有邪魔。"},{"label":"修法","sep":"：","text":"于智慧和闻思方面都能得以增上。"},{"label":"丢失物","sep":"：","text":"往西南方寻找可失而复得，或能了知其下落。"},{"label":"来客及成事","sep":"：","text":"卦象极为明朗。"},{"label":"若问其他诸事","sep":"，","text":"则卦象皆为中平，土业及依止事业略凶。"}],"remedy":"依止智慧本尊，供灯及献经旗，念诵《遣除十方黑暗经》及《光明品》则大吉。","verdict":"此卦为遣除黑暗卦。","notes":[]},{"id":"ap","father":{"code":"a","tib":"ཨ","zh":"阿","dir":"下","value":1},"mother":{"code":"p","tib":"པ","zh":"巴","dir":"北","value":3},"name":"皎洁明月","dirs":"下北","lead":"犹如虚空中具甘露光明之皎洁明月，息、增等善业卦象吉祥。","body":"","mark":"表示于无有士夫中享受欲妙。","sections":[{"label":"家庭和生命","sep":"：","text":"若作除障或沐浴则子嗣兴旺。"},{"label":"谋略与筹划","sep":"：","text":"无有魔障，温和事业卦象吉祥，怀、诛事业则功力疲软。"},{"label":"财运","sep":"：","text":"白类及饮食方面有所增长。"},{"label":"怨敌","sep":"：","text":"无有怨敌。"},{"label":"行旅之人","sep":"：","text":"一路平安，旋即归来。"},{"label":"疾病","sep":"：","text":"患染寒病及消化不良症状，可很快痊愈，无有邪魔。"},{"label":"修法","sep":"：","text":"善法智慧增长，卦象吉祥。"},{"label":"丢失物","sep":"：","text":"可派遣女人至南方或北方寻找。"},{"label":"来客及成事","sep":"：","text":"能够成办。"},{"label":"若问其他诸事","sep":"，","text":"则女人及温和事业卦象吉祥，火业略差，三幼欢喜增上。"}],"remedy":"依止白度母及尊胜母等天母，随意念诵《女人授记经》，做水施、沐浴、供养、放生及龙王欢喜之事则上吉，依上师瑜伽则吉祥。","verdict":"此卦为云开雾散之卦。","notes":[]},{"id":"ac","father":{"code":"a","tib":"ཨ","zh":"阿","dir":"下","value":1},"mother":{"code":"c","tib":"ཙ","zh":"匝","dir":"西","value":4},"name":"群星闪耀","dirs":"下西","lead":"心无动摇闲散而作则极为妙善。","body":"","mark":"表示庄严集聚无有离散。","sections":[{"label":"家庭和生命","sep":"：","text":"若制作经旗或熏烧桑烟则吉祥。"},{"label":"谋略与筹划","sep":"：","text":"出走或布施卦象祯吉。"},{"label":"财运","sep":"：","text":"木业、牲畜、绿色、布匹等方面会有消息出现。"},{"label":"怨敌","sep":"：","text":"无有怨敌。"},{"label":"行旅之人","sep":"：","text":"一路平安，顷刻即归。"},{"label":"疾病","sep":"：","text":"风心外散而已，无有大碍，进行祖神祭及祈祷木天尊，则无有邪魔。稍有急躁分别念众多之过，依止不动佛可保吉祥。"},{"label":"修法","sep":"：","text":"卦象吉祥，特别是在去往他乡等方面为上吉。"},{"label":"丢失物","sep":"：","text":"虽然已散失他方，若能迅速寻找，前往北方或东方或许能失而复得。"},{"label":"来客及成事","sep":"：","text":"卦象主来以及成功。"},{"label":"若问其他诸事","sep":"，","text":"则卦象吉祥，水业略差。"}],"remedy":"依止绿度母及事业本尊，供养护法，抛撒大量风马，作转绕、顶礼、朵马及回遮，做各种灵器等善法，阅读诸佛出游故事，如：记载诸佛出行之《华严经》等，依止绿色本尊，诸事可迅速得以成办。","verdict":"如同星曜轨道环绕虚空，可知此卦为借助风势而得以增上之卦。","notes":["灵器：用彩线绕成或用糌粑捏成日用品、牲畜、房屋等模拟物。用以供奉者称为上供灵器，用以布施鬼类者称为下施灵器。"]},{"id":"az","father":{"code":"a","tib":"ཨ","zh":"阿","dir":"下","value":1},"mother":{"code":"z","tib":"ན","zh":"纳","dir":"南","value":5},"name":"黄金大地","dirs":"下南","lead":"犹如妙善之大地般事业稳固畅旺，卦象吉祥。","body":"","mark":"表示无量无边，不可揆度。","sections":[{"label":"家庭和生命","sep":"：","text":"极其稳固兴旺。"},{"label":"谋略与筹划","sep":"：","text":"若恒依住处，放弃四方游走等可保顺畅不退转。"},{"label":"财运","sep":"：","text":"虽然略有阻滞，但最终福祉满盈。"},{"label":"怨敌","sep":"：","text":"无有怨敌。"},{"label":"行旅之人","sep":"：","text":"略有耽延，最终顺畅。"},{"label":"疾病","sep":"：","text":"虽然稍患涎病等但无妨碍，暂时不能痊愈。若做火施、风轮以及大量经旗，则无有魔障。"},{"label":"罪戾","sep":"：","text":"乃地水不调所致。"},{"label":"修法","sep":"：","text":"究竟结果吉祥，若能始终安住一处，则贤妙。"},{"label":"丢失物","sep":"：","text":"被自己人找到或速往东方寻找，设使不能找到，则极难失而复得。"},{"label":"来客及成事","sep":"：","text":"会延宕较长时间。"},{"label":"若问其他诸事","sep":"，","text":"则无有滞延，卦象吉祥。传递口信等依靠风的事业略差。"}],"remedy":"依止释迦牟尼佛、不动佛等金刚部诸尊则极为祥和，修宝生部诸尊及财神，做十万泥塔小像，在石头上凿刻咒语，建造佛塔、佛像，并作安宅等仪式也极其胜妙。","verdict":"此卦为安住扎根之卦。","notes":[]},{"id":"an","father":{"code":"a","tib":"ཨ","zh":"阿","dir":"下","value":1},"mother":{"code":"n","tib":"དྷཱིཿ","zh":"德","dir":"上","value":6},"name":"金刚妙音","dirs":"下上","lead":"有如听到喜讯一般对诸事均欢喜增上，卦象吉祥。\n学习共同学问及显宗运势畅旺。","body":"","mark":"表示以智慧天女增上无量妙智。","sections":[{"label":"家庭和生命","sep":"：","text":"若依止天女修长寿仪轨，则命根稳定。"},{"label":"谋略与筹划","sep":"：","text":"极其顺畅。"},{"label":"财运","sep":"：","text":"心满意足。"},{"label":"怨敌","sep":"：","text":"不会出现怨敌并有天尊护佑。"},{"label":"行旅之人","sep":"：","text":"心情顺畅，一帆风顺，顷刻返回。"},{"label":"疾病","sep":"：","text":"病痛即将消逝，无有魔障。"},{"label":"罪戾","sep":"：","text":"无有其他出现，即使暂时显现为凶兆，实为祥瑞之表示，若祈祷本尊则会成就或打开思路。"},{"label":"丢失物","sep":"：","text":"若依善巧方便，则可失而复得。"},{"label":"修法","sep":"：","text":"智慧能得以增长，修金刚妙音法则尤其善妙。"},{"label":"来客及成事","sep":"：","text":"万事顺意、如愿以偿。"},{"label":"若问其他诸事","sep":"，","text":"则卦象吉祥。成办息业及女人事业尤其畅旺。"}],"remedy":"此卦为六大城市主母卦，极为胜妙。若修天尊三部法及随一修法，依止黑热嘎部佛母眷属则显晟旺。依止意乐瑜伽则祥和，念诵《胜乐金刚续》、《金刚空行续》等及《三摩地王经》。做空行满愿灵器，依止单坚（དམ་ཅན）、尖扎（ལྕམ་དྲལ）、长寿五姊妹等具童子相的寂静护法，特别是依靠退敌咒语及热德（རེ་ཏ）等天女，作童女喜宴、吹奏海螺，则修持任何天尊均会成就。若精进修持天尊，则会心想事成。","verdict":"此卦为智慧增上之卦。","notes":[]},{"id":"ra","father":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"mother":{"code":"a","tib":"ཨ","zh":"阿","dir":"下","value":1},"name":"焜然之灯","dirs":"东下","lead":"犹如善妙之明灯般自心极其明朗，卦象吉祥。","body":"","mark":"表示灯火通明无有狂风作乱。","sections":[{"label":"家庭和生命","sep":"：","text":"运程顺畅。"},{"label":"谋略与筹划","sep":"：","text":"如意吉祥。"},{"label":"财运","sep":"：","text":"（藏文此处遗漏。）"},{"label":"怨敌","sep":"：","text":"未出现敌害，即使有也在远方，因鞭长莫及，无法作祟。"},{"label":"行旅之人","sep":"：","text":"一路顺畅并能知其行踪。"},{"label":"疾病","sep":"：","text":"日趋好转，无有魔障。"},{"label":"罪戾","sep":"：","text":"皆因宿业之故，导致违缘出现，但无大碍。"},{"label":"修法","sep":"：","text":"能够自力更生，无有障碍。"},{"label":"丢失物","sep":"：","text":"若前往西南方找寻，则可失而复得。"},{"label":"来客及成事","sep":"：","text":"无碍，若精进则可成功。"},{"label":"若问其他诸事","sep":"，","text":"则念出即行，不会有祲气当道。"}],"remedy":"若朗读《贤劫经》等经典，依止长寿佛、作明佛母、具光佛母以及莲花部天尊，修持玛吽噶热佛父母以及红大鹏可以成就。依靠大自在及紫玛（ཙ་དམར）护法等，并做修桥补路、火施等善法则无有障碍出现，心中愿望终将实现。","verdict":"此卦为独挡八面之卦。","notes":[]},{"id":"rr","father":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"mother":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"name":"马头明王","dirs":"东东","lead":"自己承揽之诸事能很快成办，卦象吉祥。","body":"","mark":"表示欲乐之火炽燃，并再三火上加油。","sections":[{"label":"家庭和生命","sep":"：","text":"卦象呈增上之势，身色容光焕发、神采奕奕。"},{"label":"谋略与筹划","sep":"：","text":"成功在望，可静候佳音。若能将空行修持究竟，则事业将迅速显达。"},{"label":"财运","sep":"：","text":"干燥及红色财物会有所进益，特别是若能进行大量火施，则欲乐将极为增上。"},{"label":"怨敌","sep":"：","text":"不会出现怨敌，若想镇服东方或中部的敌人，则很快将有讯息传来。"},{"label":"行旅之人","sep":"：","text":"极其迅捷地顺利回返。"},{"label":"疾病","sep":"：","text":"除患染暑热、血症及瘟疫需彻底治疗外，其他病痛将很快痊愈，无有任何魔障。"},{"label":"罪戾","sep":"：","text":"成办之事过大，且性情急躁而导致威猛本尊稍有不快，需虔诚祈祷供养缵神（བཙན）等护法。"},{"label":"修法","sep":"：","text":"修善法或怀柔事业将增上吉祥。"},{"label":"丢失物","sep":"：","text":"前往西南方寻找可失而复得。"},{"label":"来客及成事","sep":"：","text":"迅速成功。"},{"label":"若问其他诸事","sep":"，","text":"则虽然卦象吉祥，但依止事业及地、水事业非常衰落。犹如水分沸腾，蒸发殆尽或湖泊干涸一般。"}],"remedy":"依止马头明王、欲王等怀业天尊以及莲花部忿怒本尊，念诵不空罥索等观音经续。做供灯、烧施等火业，依止缵神等护法及怀、诛业天尊，可迅速成就事业，欢喜犹如火焰般炽盛。","verdict":"此卦为喜宴增上之卦。","notes":[]},{"id":"rp","father":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"mother":{"code":"p","tib":"པ","zh":"巴","dir":"北","value":3},"name":"阎罗当道","dirs":"东北","lead":"此卦象主凶杀，犹如微小之火星被水淹没，无论何事均不利，始终被死主阎王严密控制。","body":"本体行于南外门。","mark":"表示杀害、死亡和摧毁。","sections":[{"label":"家庭和生命","sep":"：","text":"主死亡或极大违缘。需做除去经函积尘等善业，并修忿怒化身朵马回遮法。"},{"label":"谋略与筹划","sep":"：","text":"违缘障碍极大，无法成事，不宜轻举妄动，放弃为佳。"},{"label":"财运","sep":"：","text":"不但不能获取，尚有灾祸降临。"},{"label":"怨敌","sep":"：","text":"有怨敌，特别要密切注意来自南方或北方的敌害。"},{"label":"行旅之人","sep":"：","text":"颇为艰难，有大祸障。需修念白伞盖母禳解法及除敌法。"},{"label":"疾病","sep":"：","text":"危险极大，会罹患寒病、水疮等水症及重症。应尽快念诵密咒、经续，若不精进疠对治，恐回天乏术。"},{"label":"罪戾","sep":"：","text":"魑魅当道之原因与饮用之饮品不当有关，另有深蓝色类圆形物，嫠妇之用品，如衣食等黑色物品类，因沾染不净及失坏等晦气而生大障。卦象显示遭到诅咒厌胜的可能性极大，应依止金刚橛、度母等作诅咒禳解及回遮则会有益。也可作缘龙王禳解厌胜等佛事，或全力以赴地护持水魔等阴卓鬼。"},{"label":"修法","sep":"：","text":"阻碍重重，需精进修持皈依法，并竭尽全力作朵马和回遮等佛事，以禳解诅咒、扫除魔障、遣除晦气。还需讽诵各种经典及诠释如来藏之类的经藏，做转移禳解、除魔灵器、四百禳解法、咒语灵器等以解除灾难，若不实施，必将大祸临头。"},{"label":"丢失物","sep":"：","text":"已去往南方或北方，但却难觅踪影。"},{"label":"来客及成事","sep":"：","text":"事与愿违、阻障纷纭、不能成功。"},{"label":"若问其他诸事","sep":"，","text":"则除了打猎、服毒、杀生及摧毁之事业之外，其他均不吉祥。"}],"remedy":"","verdict":"此卦主骤然起火，绝闷而死，为命相之违缘纷现之卦，故应大量励力修持长寿经咒。","notes":["诅咒厌胜：一种诅咒怨敌的方术。","阴卓鬼：一种障碍善行使人遭遇不幸的魔鬼。"]},{"id":"rc","father":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"mother":{"code":"c","tib":"ཙ","zh":"匝","dir":"西","value":4},"name":"大力君主","dirs":"东西","lead":"犹如借助风力而使森林之火熊熊燃烧一般，主势力增长，卦象吉祥。怀、诛事业势力雄厚。","body":"本体为摧毁语主尊。大威德地母言：","mark":"表示凡趋入此道者均可赐予力量，为猛虎、雄狮发出英勇咆哮之卦。","sections":[{"label":"家庭和生命","sep":"：","text":"主力量增上，不可作害。"},{"label":"谋略与筹划","sep":"：","text":"无论有何意趣，都具有强力。作勾招及诛业则极为胜妙。修持本尊密要顺畅且极为殊胜。"},{"label":"财运","sep":"：","text":"圆满增上，特别是绿色和椭圆形的不动类用品会进项较丰。"},{"label":"怨敌","sep":"：","text":"无有怨敌且均能百战百胜。"},{"label":"行旅之人","sep":"：","text":"一路顺畅，顷刻回返，且会值遇能予以扶助之贵人。"},{"label":"疾病","sep":"：","text":"虽感心绪纷乱，但无妨碍。若祈祷供养护法则无有魔障。"},{"label":"罪戾","sep":"：","text":"虽有护法极力护佑，但不要以曾做过大供养自诩，以前的供养尚有欠缺，还需额外增加。"},{"label":"修法","sep":"：","text":"无论修何法都极为善妙，能够成功。"},{"label":"丢失物","sep":"：","text":"若依靠力量，则可失而复得。"},{"label":"来客及成事","sep":"：","text":"能够成功，但需祈祷本尊。"},{"label":"若问其他诸事","sep":"，","text":"则均为势力增上，卦象吉祥。在祈雨等水事业方面卦象中平。"}],"remedy":"依止金刚橛等威猛本尊、身部的忿怒金刚、忿怒母、三界尊胜、忿怒莲师等主尊，念诵《五顶续》《十忿怒续》等，时常赞颂、供养护法，则会得到荫护。熏烧桑烟、抛撒风马、供养供品等。欲成办之事业将会具有强大势力且十分祥瑞。依止象鼻天护法与曜王绕哈拉将会成就。","verdict":"此卦为势力增上之卦。","notes":[]},{"id":"rz","father":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"mother":{"code":"z","tib":"ན","zh":"纳","dir":"南","value":5},"name":"干枯之树","dirs":"东南","lead":"犹如枯萎之树不能结出果实一般，主魔王信使漂移于东南方，寻食饿鬼云：\n心中恒时抱着强烈希望，却始终无法成功。","body":"","mark":"表示与痛苦常相依伴。","sections":[{"label":"家庭和生命","sep":"：","text":"虽然暂时无碍，但最终运势转衰。卦象虽然中平，但有扑朔迷离、漂移不定之相。"},{"label":"谋略与筹划","sep":"：","text":"似乎熊熊燃烧一般呈旺盛之势，实际却昏昏暗暗、晦气弥漫、难有指望。"},{"label":"财运","sep":"：","text":"一无所获。"},{"label":"怨敌","sep":"：","text":"稍有怨敌，但无大碍。"},{"label":"行旅之人","sep":"：","text":"颠簸劳累，耽延时间颇长。"},{"label":"疾病","sep":"：","text":"稍有胆病侵扰，但无妨碍，魔障方面主要是寻食神之类或亲眷阴魂未散，但无有大碍。应以大悲心做焦烟、孽债食子、水施等佛事。你住处所在神灵之福报已呈颓势，应极力唪诵《金光明经》以及招福唤财经咒，精进积资和酬补，依要诀而行则极佳。"},{"label":"修法","sep":"：","text":"虽然苦心竭虑，却成事不足，败事有余。成功的希望有如儿童寻觅彩虹般虚幻渺茫。"},{"label":"丢失物","sep":"：","text":"已被他人隐藏，极难收回。"},{"label":"来客及成事","sep":"：","text":"自心被他人所转，犹如梦中营生难见成效。"},{"label":"若问其他诸事","sep":"，","text":"则均呈衰相，尤其是谋求欲乐方面更是主凶。若想从某事中脱身则机会极佳，定能成全退隐之愿。"}],"remedy":"作经忏，念诵《地藏十轮经》《金光明经》等，以及增上饮食、财物方面的咒语和《文殊根本续》。","verdict":"此卦为饿鬼无有精华之卦。","notes":["焦烟：布施给一切中有鬼物的混有乳、酪、酥三素，和血、肉、脂三荤的糌粑火烟。","食子：消除孽债的一种食子。"]},{"id":"rn","father":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"mother":{"code":"n","tib":"དྷཱིཿ","zh":"德","dir":"上","value":6},"name":"南方门尊","dirs":"东上","lead":"瑞气盈门，卦象吉祥。主睁开智慧之眼。","body":"","mark":"表示招来西方天女为助伴。","sections":[{"label":"家庭和生命","sep":"：","text":"家庭祺瑞增上，命星通泰旺盛。"},{"label":"谋略与筹划","sep":"：","text":"若听从良友劝告则吉祥。眼药、圆光等依靠眼见的事业尤其畅旺。"},{"label":"财运","sep":"：","text":"倘若勤劳精进，则会有所回报。"},{"label":"怨敌","sep":"：","text":"无有怨敌。"},{"label":"行旅之人","sep":"：","text":"平安顺利，瞬息即归。"},{"label":"疾病","sep":"：","text":"若做经忏等佛事，则会立即有所好转。无有任何魔障。"},{"label":"修法","sep":"：","text":"卦象吉祥，尤其是学习、净障等则极为有利。"},{"label":"丢失物","sep":"：","text":"若前往南方或西方找寻会失而复得。"},{"label":"来客及成事","sep":"：","text":"福星高照，定可大展宏图。"},{"label":"若问其他诸事","sep":"，","text":"则均为上吉之相。若有不能胜任之事，则顿生退意，不会枉费心机。"}],"remedy":"依止大红威德则吉祥，修持语天女、莲花部尊众、具光佛母等主尊以及单坚等随一护法，则能如虎添翼、青云直上。讽诵《寺院》《精华》《金光明经》《宝箧经》《神马续》《作明佛母续》等，并作供灯、念诵《欲成颂》等善法，则自心自然趋往良善。","verdict":"此卦为良友开示妙智之卦。","notes":["《欲成颂》：祈祷莲师等成就一切所愿的仪轨。"]},{"id":"pa","father":{"code":"p","tib":"པ","zh":"巴","dir":"北","value":3},"mother":{"code":"a","tib":"ཨ","zh":"阿","dir":"下","value":1},"name":"甘露妙瓶","dirs":"北下","lead":"犹如瓶中盛满甘露，成办息业必定成功。","body":"","mark":"表示因享用甘露而与死神永别。","sections":[{"label":"家庭和生命","sep":"：","text":"满门吉庆。"},{"label":"谋略与筹划","sep":"：","text":"无有险阻，万事亨通，但应随意修一上师法。"},{"label":"财运","sep":"：","text":"不招自来，定可获取收益，如同妙瓶自然生出一切所欲。"},{"label":"怨敌","sep":"：","text":"无有怨敌，且均持寂静调柔心态。"},{"label":"行旅之人","sep":"：","text":"一路顺畅，且急缓有度。"},{"label":"疾病","sep":"：","text":"若作治疗、经忏等，则一切所作皆化为甘露，对患者尤其有利。无有魔障。"},{"label":"修法","sep":"：","text":"若作息业等，则可保成功吉祥。依止普明佛等除障本尊、药师佛、不动佛等则善妙。"},{"label":"丢失物","sep":"：","text":"可前往南方或湖畔搜寻。"},{"label":"来客及成事","sep":"：","text":"万无一失。"},{"label":"若问其他诸事","sep":"，","text":"则做温和事业时机适宜，若做下毒等恶业则绝对失败，应趁早放弃打算。作水施、宝瓶沐浴、超度、忏悔、净障等，则一切违缘均可消失。"}],"remedy":"","verdict":"此卦为祝福洋溢，息业增上之卦。","notes":[]},{"id":"pr","father":{"code":"p","tib":"པ","zh":"巴","dir":"北","value":3},"mother":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"name":"无源池沼","dirs":"北东","lead":"犹如源泉阻断之池沼，主一切受用均遇阻滞。","body":"","mark":"表示魔王信使游历于西南方，罗刹总汇云：“于海中以沙砌屋有何意义？”","sections":[{"label":"家庭和生命","sep":"：","text":"虽然暂时无舛，但究竟结果不妙，应励力积集资粮。"},{"label":"谋略与筹划","sep":"：","text":"卦象中平，妄想依朋友得利则如水中捞月，终无指望。"},{"label":"财运","sep":"：","text":"暂时稍显丰盈，但不会长存，终无利益。"},{"label":"怨敌","sep":"：","text":"虽然频频算计，试图加害，却始终不能得手。"},{"label":"行旅之人","sep":"：","tex l":"怨敌","sep":"：","text":"若有怨仇出现，也能战胜对方，化险为夷。"},{"label":"行旅之人","sep":"：","text":"一路顺畅，即刻携佳音而归。"},{"label":"疾病","sep":"：","text":"风症肆虐，但无大碍。无有魔障。"},{"label":"修法","sep":"：","text":"时机极佳，且能获得盛誉。"},{"label":"丢失物","sep":"：","text":"若前往东北方寻找，可迅速收回。"},{"label":"来客及成事","sep":"：","text":"一切所愿皆能实现。"},{"label":"若问其他诸事","sep":"，","text":"则均为吉祥稳妥之卦象。地、水之业成功之相渺茫。"}],"remedy":"依靠供养、赞颂和放咒，修持忿怒蓝杖明王和怎扎母，依止事业天尊、那内玛（ན་ནེ་མ）、尸林主等护法及扎拉护法则吉祥，尤以修香炯根达旬呢（ཞང་སྐྱོང་ཀུན་དགའ་གཞོན་ནུ）护法为胜。出行之事极利。若励力经忏，则为修空行及神足等成就之极大助缘，此间做摒除之事尤为适宜。对僧人敬献哈达、供斋及布施等则可保无往不利。","verdict":"此卦乃迅速断定，闻听悦耳妙语之卦。","notes":[]},{"id":"cz","father":{"code":"c","tib":"ཙ","zh":"匝","dir":"西","value":4},"mother":{"code":"z","tib":"ན","zh":"纳","dir":"南","value":5},"name":"蕴聚魔王","dirs":"西南","lead":"犹如树干拦腰折断，家庭、寿命及财运皆主凶。\n宜于念诵各种咒语，做朵玛及回遮等法事。","body":"","mark":"表示：位于东外门之害命屠夫曰：以利刃之镰切割草木。","sections":[{"label":"谋略与筹划","sep":"：","text":"魔障来势凶猛，十分不利，应讽诵驱魔除障经咒及《度母经》、《遣除十方黑暗经》及《解脱经》。"},{"label":"怨敌","sep":"：","text":"敌军庞大，尤以东方及中方之危害为甚。应作马头明王及金刚降敌法、解除厌胜法。最近有招致大人物之责难等相，应以战战兢兢、如履薄冰之心度过这一低迷时期。"},{"label":"行旅之人","sep":"：","text":"违缘重重，事端频繁，难以如期回返。"},{"label":"疾病","sep":"：","text":"涎病十分沉重，会引发呼吸困难等症状，应做各种禳解及灵器。无有魔障。"},{"label":"罪戾","sep":"：","text":"因冲撞地祇及当方神，由黄色或四方物品以及凶宅等，或因势力显赫的僧人或苯教徒挈带物件由魔王附着而引发，其缘由可归咎于人类或大力非人不悦，或毁坏佛塔、佛像等而致晦气弥漫，应做熏烟沐浴等事以净除邪气。"},{"label":"修法","sep":"：","text":"道路险阻。应依止度母等除障本尊，作消除隘道法门，讽诵《八显现》及《遣障法》，整治尸林、土地或区域，使当方神欢悦，则可化险为夷。"},{"label":"丢失物","sep":"：","text":"犹若落入狮口之肉般难以夺回。"},{"label":"来客及成事","sep":"：","text":"虽然声势浩大，却一无所成。"},{"label":"若问其他诸事","sep":"，","text":"则均为不利之卦象。唯有欺瞒他人等狡诈之事，压服、诅咒及陷害等恶业能事事顺意。"}],"remedy":"作朵玛及回遮仪式，修持《八大法行》，作战胜灵器、解缚等法门。精进修持大白伞盖佛母及金刚橛，方可逢凶化吉。","verdict":"此卦乃巍峨重山镇压之卦。","notes":[]},{"id":"cn","father":{"code":"c","tib":"ཙ","zh":"匝","dir":"西","value":4},"mother":{"code":"n","tib":"དྷཱིཿ","zh":"德","dir":"上","value":6},"name":"东方门尊","dirs":"西上","lead":"赞誉之声四处传扬，一切所愿均能成办，卦象吉祥。也可称之为如意宝树。\n家庭、生命、谋略与筹划和财运都将有新的转机，呈欣欣向荣之势，为他人传送讯息等事尤为善妙。","body":"","mark":"表示事业飞幡迎风招展。","sections":[{"label":"怨敌","sep":"：","text":"无有怨敌，舒心悦意。"},{"label":"行旅之人","sep":"：","text":"一路顺畅，值遇良伴，俄顷返回。"},{"label":"疾病","sep":"：","text":"病痛息灭，无有魔障。"},{"label":"修法","sep":"：","text":"卦象吉祥，智慧及行事呈蒸蒸日上之势。"},{"label":"丢失物","sep":"：","text":"若前往东方或北方搜寻，可失而复得。"},{"label":"来客及成事","sep":"：","text":"抉择英明，如火加薪，必将成事。"},{"label":"若问其他诸事","sep":"，","text":"则均为如是而行，则天时地利之卦。"}],"remedy":"依止大力本尊、罗炯玛（ལོ་གྱོན་མ）、尊胜母、度母及事业部本尊，供养四臂护法、扎拉护法等，依靠玛积山神及夜叉等则胜妙。讽诵《善解密意经》、《稻秆经》、《富楼那请问经》、《弥勒请问经》、《狮吼经》及《华严经》，做讲经闻法、吹奏海螺、树立飞幡等善法均极为有利。","verdict":"此卦乃阐演悦语，游戏开场之卦。","notes":[]},{"id":"za","father":{"code":"z","tib":"ན","zh":"纳","dir":"南","value":5},"mother":{"code":"a","tib":"ཨ","zh":"阿","dir":"下","value":1},"name":"黄金山王","dirs":"南下","lead":"犹如金山高耸入云，主家庭和寿命稳如山王。","body":"","mark":"表示不变永恒之意。","sections":[{"label":"谋略与筹划","sep":"：","text":"结局稳如泰山。"},{"label":"财运","sep":"：","text":"保存已有财力，稳定不变且自然善妙。"},{"label":"怨敌","sep":"：","text":"无有怨敌，且己方势力稳固。"},{"label":"行旅之人","sep":"：","text":"无有违缘，稍有延滞。"},{"label":"疾病","sep":"：","text":"病痛消亡，无有魔障。"},{"label":"修法","sep":"：","text":"恒定稳固，无有动摇，自然胜妙。"},{"label":"丢失物","sep":"：","text":"不会落入他人之手。"},{"label":"来客及成事","sep":"：","text":"勇往直前，决不退转，其他之事虽有所耽延，但终能实现。"},{"label":"若问其他诸事","sep":"，","text":"则虽然卦象吉祥，但略有延宕。"}],"remedy":"应讽诵《华严经》及律经，依止阎罗部佛母及金刚部诸尊、地藏王菩萨、广目天王、多闻天子以及财神则增上吉祥。宜塑造佛像、修建佛塔，作稳固事业。","verdict":"此卦乃获得无有变迁之见地，基础稳固，飞黄腾达之卦。","notes":[]},{"id":"zr","father":{"code":"z","tib":"ན","zh":"纳","dir":"南","value":5},"mother":{"code":"r","tib":"ར","zh":"Ra","dir":"东","value":2},"name":"天子之魔","dirs":"南东","lead":"犹如美妙宫殿被火焚烧，卦象祲晦。","body":"","mark":"表示：住于西外门之欺众大邪师曰：“欲火焚身，自必毁灭。”","sections":[{"label":"家庭和生命","sep":"：","text":"摇摇欲坠，风雨飘摇。"},{"label":"谋略与筹划","sep":"：","text":"徒劳无功，空手而返。"},{"label":"财运","sep":"：","text":"恰似绸缎燃烧所余灰烬般所剩无几。"},{"label":"怨敌","sep":"：","text":"怨敌猖獗，尤其西南方更是风狂雨骤。"},{"label":"行旅之人","sep":"：","text":"人与财物均面临危险境地。"},{"label":"疾病","sep":"：","text":"会罹患热邪、血症及疫疠等病，疼痛缠身，患者苦不堪言，大事不妙。其原因可归咎于血肉及来自西方之三角形物品或红色物品带来魔障之故，也可能是由于灶烟触怒火神所致。"},{"label":"修法","sep":"：","text":"险象环生，步履维艰，应大量作寂静护摩及水施，修持药师佛及白色寂静本尊，策励讽诵《莲师遗教》及莲师心咒。"},     if (G.remedy) h+='<p class="rm">'+G.remedy+'</p>';
    if (G.verdict) h+='<p class="vd">'+G.verdict+'</p>';
    if (G.notes.length){
      h+='<div class="nt">';
      G.notes.forEach(function(n){ h+='<p>'+n+'</p>'; });
      h+='</div>';
    }
    return h;
  }

  /* 第二遍小卡片：贴在第一卦卦名之下，让人一眼看到两遍结果。
     判法照原文：同名可肯定 / 佛父佛母颠倒重占 / 不同再占一次，吉凶不替用户判 */
  var card="";
  if (G2){
    var same=G2.father.value===G.father.value && G2.mother.value===G.mother.value;
    var swap=G2.father.value===G.mother.value && G2.mother.value===G.father.value;
    card='<div class="two"><p><b>第二遍</b>'+G2.name+'　方位：'+G2.dirs+'</p>'+
      '<p class="r">'+(same?"两遍同一卦，可作肯定。"
        : swap?"佛父佛母两遍颠倒，按原文需重新占卜。"
        : "两遍不同：吉凶一致则作肯定，不同则再占一次。")+'</p></div>';
  }
  var h="";
  if (q) h+='<p class="ask"><b>所问</b><span id="q"></span></p>';
  if (G2) h+='<p class="tag">两占 · 第一遍</p>';
  h+=sheet(G,card);
  if (G2) h+='<div class="sep"><span>第二次卦象</span></div>'+sheet(G2);
  document.getElementById("out").innerHTML=h;

  /* 留一条记录：只存「回到这一卦的地址 + 卦名 + 所问 + 时间」，正文不复制一份。
     同一个地址只记一次 —— 刷新卦象页不该多出一条。用不了 localStorage 就静默跳过，
     记录不该妨碍看卦 */
  try{
    var U=location.pathname.split("/").pop()+location.search;
    var LOG=JSON.parse(localStorage.log||"[]");
    /* 同一地址全表只留一条：从记录页回看旧卦也会走到这里，
       只对比最新一条的话，每回看一次就多出一条重复记录 —— 挪到最前、刷新时间 */
    LOG=LOG.filter(function(x){ return x.u!==U; });
    LOG.unshift({t:Date.now(),k:"文殊",u:U,n:G.name,q:q});
    localStorage.log=JSON.stringify(LOG.slice(0,100));
  }catch(e){}

  /* 所问是用户输入，只许走 textContent */
  if (q){
    document.getElementById("q").textContent=q;
    /* 返回掷骰再掷一次时，所问不能丢 */
    document.querySelector(".back").href="cast.html?q="+encodeURIComponent(q);
  }
})();
</script>
