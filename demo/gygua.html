<!DOCTYPE html>
<html lang="zh-CN"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 观音卦象 · v0.1
     段落顺序照原文：卦名 → 偈颂 → 分块（18–27 条）。观音原文没有分块小标题，
     这些栏名是数据整理时抽出来的索引，所以用绛红＋冒号，和正文分开读。
     全页正文一律 14，唯一的分层点是卦名（汉 26 / 藏 34）；与文殊卦象页同一套规格。 -->
<title>观音卦象</title>
<style>
@font-face{font-family:Tibetan;src:url(../assets/tibetan.woff2) format("woff2");font-display:swap}
:root{
  --bg:#F7F7F5; --card:#FFFFFF;
  --ink:#1B1B1A; --ink2:#666662; --slate:#56564F;
  --zhu:#A33E2C; --line:#E5E5E1;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --tib:"Tibetan","Noto Serif Tibetan","Microsoft Himalaya",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
:focus-visible{outline:2px solid var(--zhu); outline-offset:2px; border-radius:3px}
html{overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.7 var(--sans); letter-spacing:.02em;
  max-width:420px; margin:0 auto; padding:0 20px calc(32px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* 顶栏：与首页、仪轨、所问、掷骰同一个 13/500 */
.bar{display:flex; align-items:center; gap:13px; height:52px;
  border-bottom:1px solid var(--line);
  font:500 13px/1.4 var(--sans); letter-spacing:.02em}
.back{flex:1; display:flex; align-items:center; gap:3px;
  color:var(--ink2); text-decoration:none}
.back i{font-style:normal; font-size:16px; line-height:1; margin-top:-2px}
.bar .tr{color:var(--ink)}

/* 所问：用户自己写的那句话，是这张卦象的「题」。没有问题就不出这一段。
   原来 14px 墨灰、和注一个颜色，读起来是页脚注释 —— 翻到这一屏时对不回去。
   现在加一道 2px 朱砂竖线，它就成了引用；「所问」两个字改成块级小标，
   长问题折行也从左边起头，不会被标签挤成锯齿 */
.ask{margin-top:16px; padding-left:11px; border-left:2px solid var(--zhu);
  font-size:14px; line-height:1.6; color:var(--ink);
  text-align:justify; text-justify:inter-ideograph}
.ask b{display:block; margin-bottom:3px;
  font:600 11px/1 var(--sans); letter-spacing:.16em; color:var(--zhu)}

/* 卦名一行三件：汉语 → 藏语 → 方位。藏文字身远小于汉字，34 才和 26 的汉字等重 */
.nm{display:flex; flex-wrap:wrap; align-items:baseline; gap:11px; margin-top:16px;
  font:500 26px/1.3 var(--sans); letter-spacing:.02em}
.nm .ti{font:400 40px/1.7 var(--tib); white-space:nowrap; flex:none; letter-spacing:0}

/* 正文一律 14，一号到底：偈颂、标记、分项、禳解、判词、注全同号。
   原先 17/14 两级，同一页里读起来像两套体系 —— 这一页的字号分层只留一处：卦名 */
.lead,.vd,.mk,.rm,.s,.nt{font-size:14px; line-height:1.75;
  text-align:justify; text-justify:inter-ideograph; text-wrap:pretty}
.lead{margin-top:20px; white-space:pre-line}
/* 标记是偈颂的下半句（「…自心安住于圆满清净等舍。／表示三解脱空性之声。」），
   只是换行，不是换级：字号、颜色、行高全部继承上面的 .lead，只有段距小一点 */
.mk{margin-top:6px}
.s{margin-top:9px}
.s b{font-weight:600; color:var(--zhu)}
.rm{margin-top:22px; white-space:pre-line}
.vd{margin-top:18px; font-weight:500}
/* 注：原文用「>」引出的词条。不写「注」两个字 —— 那条线就是标题 */
.nt{margin-top:24px; padding-top:11px; border-top:1px solid var(--line); color:var(--ink2)}
.nt p+p{margin-top:5px}

/* 回首页：这一页没有别的出口，顶栏的「返回」只回到掷骰 */
.home{display:flex; align-items:center; justify-content:center; height:46px; margin-top:34px;
  border:1px solid var(--line); border-radius:10px; background:var(--card);
  font:500 14px/1 var(--sans); color:var(--ink); text-decoration:none}
.home:hover{border-color:var(--slate)}
</style>

<header class="bar">
  <a class="back" href="gycast.html"><i>‹</i>返回</a>
  <span class="tr">观音卦象</span>
</header>

<script>/*@DATA@*/
window.GUANYIN = {"syllables":[{"value":1,"code":"om","tib":"ༀ","zh":"嗡"},{"value":2,"code":"ma","tib":"མ","zh":"玛"},{"value":3,"code":"ni","tib":"ཎ","zh":"尼"},{"value":4,"code":"pad","tib":"པད","zh":"巴"},{"value":5,"code":"me","tib":"མེ","zh":"美"},{"value":6,"code":"hum","tib":"ཧཱུྃ","zh":"吽"}],"guas":[{"n":1,"code":"om","tib":"ༀ","name":"海螺之山","verse":"无有动摇稳如山，本尊加被入云端，尊身即为白海螺，乃是大梵天之卦。","blocks":[{"label":"修持正法","text":"殊胜正法之事宜，修何法门皆能成。"},{"label":"家庭","text":"家庭卦象妙且善，尤以妇女更祥祯。"},{"label":"财物·牲畜","text":"房宅财物之卦象，马匹成群子嗣盛，山羊绵羊小牲畜，有死亡相当谨慎。"},{"label":"化解","text":"念诵度母莲师咒，门前悬挂经旗等，莲师心咒念十万，讽诵白伞陀罗尼，则其结果极妙善，人丁兴旺香火盛。刻印龙王十万身，十万泥塔细细做，精勤讽诵百字明，善做金桥佛事等，其果必然极贤胜。"},{"label":"行事","text":"若卜大事迅速成，区区小事有拖延。"},{"label":"疾病","text":"病患无有生命障。虎兔属人极祥禧，属鼠属猪则主凶，头部上身病痛兴。"},{"label":"魔害","text":"魔王盘踞之处所，木铁红衣角皮等，黎明天亮之卯时，淡黄色之标志物。或由东方前来至，头具特殊相貌者，手中执持而带至，置于宅中极高位。或由白色之物品，患者头颈部系带，彼等导致魔作害。"},{"label":"魔害·化解","text":"于上半夜之戌时，或做征兆明显梦，故诵忿怒莲师咒，厉行除魔之仪轨，遗教心咒精进诵，念皈依偈印经旗，制作十万观音身。"},{"label":"寿命·怨敌","text":"寿命卦象无障碍，怨敌卦象无踪影。"},{"label":"追踪·诉讼·盗贼","text":"追踪强盗乃良机，诉讼争论必获胜，盗贼东及东南隅。"},{"label":"巡查·请求","text":"巡查之事千祥集，请求事宜效果具。"},{"label":"庄稼","text":"播种庄稼获丰收。"},{"label":"行人","text":"出行之人顷刻离，天亮出发乃佳时，熏烟抛撒风马吉。"},{"label":"经商","text":"经商营贾得厚利。"},{"label":"行人","text":"行人出发至须臾，或者听闻其讯息，若未出发则难临。上师以及官宦等，身于宝座未启程。"},{"label":"行人·宾客","text":"平凡士夫已上路，远方贵客速驾临，近处宾客却难请。"},{"label":"丢失物品","text":"丢失物品之卦象，东方高山之巅顶，山涧谷地白崖壁，白色记号之方域，迅速找回无怀疑。丢失微小之礼物，房屋宅地及高处，保险白色标志处，详加探寻必收回。"},{"label":"转生","text":"上师僧众及俗眷，精进讲经与修法，必定往生极乐刹。"}]},{"n":2,"code":"ma","tib":"མ","name":"璀璨日轮","verse":"光明遣除四洲暗，天尊荫蔽暂未现，熏烟供养护法吉，乃为天授国王卦。","blocks":[{"label":"修持正法","text":"修持正法诸事体，讲经演法乃上吉，修行则有违缘现，念除道障需励力。"},{"label":"家庭·牲畜","text":"家庭诸事均平安，老叟福星高挂天，马牛羊有血光相，盗贼豺狼逞凶狂，压敌除贼做则祥。"},{"label":"子嗣","text":"精进念诵金光经，财神鼓鸣十地经，则有扶幼助壮功，若无幼童生女婴。"},{"label":"化解","text":"压夭折鬼及铁服，金刚橛法当勤行。"},{"label":"行事","text":"事宜无论巨与细，精进而为则能成。"},{"label":"疾病","text":"患者病情极重危。马蛇年生相祺瑞，鸡猴属人灾降临，肾腰手足病痛生，地祇龙王乃祸根。"},{"label":"魔害","text":"或于凶险地困眠，触犯妖怪显怒容。魑魅附体者手擎，清晨辰时天方明，红色四方之供品，氆氇布匹或哔叽。或为器皿红色食，自南方位而来临。四处游方之僧苯，右手具标志特征，红色乘骑而带进，置于家中半高地。或由黄色红色等，患者自己身上置，彼等即为魔害因。夜半二更亥时分，诱发病灶生起令。"},{"label":"化解","text":"欲成颂及莲师咒，马头明王遗教等，精勤念诵万事兴。"},{"label":"寿命·怨敌","text":"寿命卦象无凶星，怨敌头上缠布巾，盗贼稍有行动。"},{"label":"化解","text":"熏烧桑烟撒风马，压服敌患须精进。"},{"label":"追踪","text":"强盗土匪卦吉祥，追踪之运不盛昌，何者纠察乱方向。"},{"label":"诉讼","text":"诉讼争端诸卦象，念黑官司胜对方。"},{"label":"盗贼","text":"盗贼南及西南隅，黾勉精勤细搜寻，遇人悉知或听闻，几日之后将能获。"},{"label":"商榷","text":"研讨商榷之事情，虽费口舌终融融。"},{"label":"庄稼","text":"庄稼得遇丰收年。"},{"label":"行人·经商","text":"出门之人有耽延，旭日东升启程贤，稍有丢失物品相，经商获利为一般。"},{"label":"行人·宾客","text":"宾客若未迅速至，则会延宕及拖延，获得讯息须臾间。"},{"label":"丢失物品","text":"丢失物品之卦象，南方陵谷半腰间，位于树中或断岩，前往寻找可回返，或依他人音讯断。丢失细小之物件，附近门槛内外间，板壁罅隙前往地，彼处探察可找寻。"},{"label":"转生","text":"生于何处之卦象，俗众孩童及女人，家中延请经忏僧，若其励力勤讽诵，解脱经及金刚经，则生非天罗刹处。彼等若能修佛法，投胎印度得人身，出家僧及善趣生，且有某种果位成。僧人若护戒誓言，来世获得比丘身，精勤念诵礼绕等，则能往生现喜刹。"}]},{"n":3,"code":"ni","tib":"ཎ","name":"璁玉宝树","verse":"松石宝树吐芳华，芳香果实遍天下，乃为转轮王之卦。","blocks":[{"label":"化解","text":"常祈护法倏然断，当供护法熏桑烟，供养八部插风马。"},{"label":"修持正法","text":"修持正法之卦象，一切所修均能成。"},{"label":"家庭","text":"家庭之卦主安宁，尤其上师高官等，发大悲心极祥祯。"},{"label":"子嗣","text":"若有幼童主生病，或者年幼羊羔等，稍有凶相当熏香，摧魔沐浴则转祥。有无子息之事体，地水八卦欲相宜，当做泥塔刻普巴，再插等身真言旗，放生等善精勤作，具智婴孩则落地。"},{"label":"疾病","text":"病痛卦象凶障厉，鸡猴生人则祯祺，马蛇年生三日障，重症热症及中风，皆因天魔来做东。"},{"label":"魔害","text":"或由衣物之晦气，自之亲朋至爱等，阴魂不散紧相缠。日光转暖之巳时，日落方向而来至，亲眷挚爱密友等，右手明显具特征，手中执持祸害因。或由蓝色黑色物，或因置于炉灶方，某种外卷之物品，彼等凶煞天魔踞。"},{"label":"魔害·化解","text":"夜半三更之子时，身感疼痛不舒适，白伞摧敌万数圆，赎灾供品孽债食，需做等同年岁数。"},{"label":"化解","text":"励力火施求灌顶，治疗经忏当殷勤，三天之后分晓明。"},{"label":"寿命·怨敌","text":"寿命卦象无煞祲，怨敌盗贼无动静，丢失物品慎则祥。"},{"label":"行事","text":"现今人心多浮躁，无有障碍令心焦。大事需与人合伙，虽有延缓有结果。区区小事难办妥。"},{"label":"出兵·追踪","text":"出兵征战有血光，追踪巡查能赶上。"},{"label":"诉讼","text":"诉讼之事力相当。"},{"label":"盗贼","text":"盗贼西或西北方，速速搜寻能落网。"},{"label":"化解","text":"勤供衮波并熏桑，才可稍微将心放。"},{"label":"请求","text":"请求事宜众说多，日后方能有结果。"},{"label":"商榷","text":"商量之事主和合。"},{"label":"庄稼","text":"五谷丰登粮满仓，稍有干旱之征象，供养八部则吉祥。"},{"label":"行人","text":"行人出门有耽搁，日暖时分上路和。"},{"label":"经商·行人","text":"生意兴隆财源滚，回返行人已动身，启程出发有一程。"},{"label":"行人","text":"或有丢失物品相，言语粗暴带血腥，事不能成且耽延。近处行人未启程。"},{"label":"丢失物品","text":"物品丢失之卦象，西方大江山谷口，自己寻找将彷徨，即使值遇于他乡，也有困难把路挡，询问他人细搜探，久耽失物方能返。丢失细微之物件，落于附近自身边，已被他人所霸占，不得卦象极明显。"},{"label":"转生","text":"转生何处之卦象，上师僧众卦吉祥，转于报身刹土上，慈悲之心极增上。俗众孩童及女人，精进念礼转绕等，救护生灵勤放生。若是女人对父母，当极恭敬持孝心，百玛尼石等寿刻，或插等岁之经旗，供养无数长明灯，如此而作人道中，转为具戒出家僧，或得具有大福报，喜爱正法之人身，身体具备一切根。"}]},{"n":4,"code":"pad","tib":"པད","name":"辽阔大海","verse":"浩渺无垠大海炸，惊涛骇浪起喧哗，乃为罗刹王之卦。","blocks":[{"label":"魔害","text":"天尊护佑相平庸，护法遭受晦气熏，触犯天尊怒火生，护法动怒财神离。"},{"label":"化解","text":"当修财神供护法，熏烟烧香沐浴等，除敌压敌及缚匪，四面佛母回遮等，尽力行持除晦气。"},{"label":"修持正法","text":"修持正法之卦象，任修何法遭魔殃，励诵佛经度母法，欲成七句祈祷文，勤诵忿怒莲师咒。若修诛法则能成。"},{"label":"家庭","text":"家庭卦象乃中平，年轻妇女极祥祯，若有孩童也昌盛。"},{"label":"家庭·怨敌","text":"男人遭受诅咒殃，回遮怨敌金刚爪，黑诉讼经勤念诵。"},{"label":"牲畜","text":"马牛羊相极普通，有损当念招财颂，陀罗尼集八千颂，精勤讽诵运飙升。"},{"label":"牲畜·魔害","text":"猴鸡之人魔缠身，念诵降伏夭折鬼，除魔铁服可转运。"},{"label":"疾病","text":"病疫之卦不太平，生肖鼠猪有福星，虎兔生人则主凶，涎病寒症相缠紧。"},{"label":"魔害","text":"正午日中午时分，自北方向而来至，绝后妇女之四肢，具有奇特之标志。或者着魔人手中，黑色灶具类物品，或具金光物作害，彼为魔女盘踞处。"},{"label":"化解","text":"修长寿法压魔女，长寿三尊或度母，一十万身当细做，或者修持度母法，念诵赎死祥瑞生。"},{"label":"魔害·化解","text":"夜半四更丑时分，出现凶恶之梦境，众人共讽长寿咒，灾难息灭转祺祯。"},{"label":"化解","text":"念诵药师名号咒，治病服药方对症。"},{"label":"寿命·疾病","text":"生命卦象当无妨，病患沉重应紧张。"},{"label":"怨敌","text":"不见劲敌出征相。"},{"label":"盗贼","text":"内外盗贼引恐慌，当供地祇及八部，山上熏烟撒风马，压服敌患当勤做。"},{"label":"行事","text":"行事卦象不吉祥，大事终究会泡汤，区区小事能办成。"},{"label":"出兵·追踪","text":"派兵征战空手返，马死鞍废狼狈还，追踪之事也难赶。"},{"label":"诉讼·盗贼","text":"诉讼事宜终无果，盗贼北及东北角，凶地恶族处藏躲，长时侦察无下落。"},{"label":"请求","text":"请求开许不得允，尚会引发恶争论。"},{"label":"商榷","text":"商量之事运不妙，开初融洽终分道，心中愤恨暗拨挑。"},{"label":"庄稼","text":"田地庄稼之卦象，冰雹仇敌把路挡，当供八部及龙王。"},{"label":"行人","text":"行人出门之卦象，敌贼均有当供桑。"},{"label":"牲畜·行人","text":"马匹牲畜煞气刚，幢顶臂严马明王，此等佛事切莫忘，正午时分出门祥。"},{"label":"经商","text":"商贾之事不顺畅，惨淡经营本赔光。回程尚未把路上，往后拖延时极长。口中抱怨元气伤。"},{"label":"行人","text":"近处行人现已返，带来喜讯及笑颜。"},{"label":"丢失物品","text":"若想追查丢失物，北方河边大山谷，投靠他人自亲属，已经获得莫辛苦。倘若失散细小物，自己前行之方向，意想不到某地方，黑色扁平标志处，查寻随即可归主。或者落他人手中，详加盘查不落空，或者根本未散失。"},{"label":"转生","text":"转生何处若寻访，将堕旁生之列行，愚痴痛苦实难当。彼若行善则能防，转绕念诵百字明，无垢忏悔续等等，大量讽诵当精勤，解救无数之生命。则于赡洲之中土，获得修法之人身，或为修法乞丐身，顶礼朝圣极殷勤，彼等寿数圆满后，吉祥殊胜之刹土，如海空行中诞生。"}]},{"n":5,"code":"me","tib":"མེ","name":"火山爆发","verse":"火山岩浆猛喷发，此生福德被烧塌，乃为龙妖王之卦。","blocks":[{"label":"魔害","text":"护佑天尊遭铩羽，名誉运数皆背离，常供护法与妖精，倏然中断卦象具。"},{"label":"化解","text":"不得安宁互相嫉，当于彼等多供祈，酬补忏悔当励力。"},{"label":"魔害","text":"或为携童之妇女，做客带来咒晦气，家中天尊被赶驱，当遣魔女做灵器。"},{"label":"修持正法","text":"修持正法之运气，修行很难达目的，欲成除十方暗等，精勤念诵有裨益，讽诵事宜当能成，顶礼转绕有福礽。"},{"label":"家庭","text":"家庭卦象不景气，妇女老人主凶祲，儿童也有坏遭遇。"},{"label":"家庭·怨敌","text":"男士遭受诅咒殃，或遇刀枪等兵器，焰口母替死仪轨，四百禳灾除障蔽，十三周期等勤作，缚敌除敌做则利。"},{"label":"牲畜","text":"马牛羊等厄运生，小畜禽带血光运，护牲畜咒贤劫经，勤念还需修财神。"},{"label":"子嗣","text":"膝下有无子嗣相，命中血脉将绝光，若将龙王宝瓶藏，十万水施供当方，地藏十轮经勤诵，龙王悉地现曙光，许有女婴会降临。"},{"label":"疾病","text":"疾患卦象主凶煞，狗龙生人乃吉卦，牛羊年生违缘大。胆病重症齐宣战，乃为灶塘晦气旋，皆因妖精被触犯，兴妖作怪闹翻天。"},{"label":"化解","text":"供妖灵器把运转。"},{"label":"魔害","text":"日方偏西未时分，罗刹独脚鬼攀附，俗家男子或僧苯，位于附近某一处，身著黑衣脚开步，手中携带具缝物，或者具有图案物，或许红皮及红肉，或为具有红光物。患病之人已目睹，故而死魔纠缠彼。"},{"label":"化解","text":"寅虎之时夜将尽，患者灵魂四处飘，伏魔灵器长寿经，焰口替死精进行，四百禳解招魂魄，避死需念大藏经，马头大鹏金刚手，大威德法需灌顶，颠簸之路修整平，才可保得一条命。或者离乡去飘荡，顶礼朝圣转绕忙，治病服药无影响。"},{"label":"寿命·怨敌·盗贼","text":"身寿之卦主寿毙，敌人也来兴风雨，门里门外盗匪集，酬补天尊方能吉。"},{"label":"化解","text":"猛兽四大来为敌，精进念诵大白伞，天地八现吉祥积。"},{"label":"行事","text":"行事之卦不如意，未能成功悔莫及，无论事情巨与细，均以不成而答予。"},{"label":"出兵","text":"出兵打仗则吉祥，敌方财物落己仓，敌情出现需焚香。"},{"label":"追踪·诉讼·盗贼","text":"追踪之事空手返，悔恨不悦遭责难，若打官司己败诉，遭人嘲笑与挖苦，窃贼潜藏于近处，长时寻找无门路，请求事宜遇梗阻。"},{"label":"商榷","text":"若问商榷之卦象，开初会晤不顺畅，终究无法通商量。"},{"label":"庄稼·财物","text":"田中庄稼遭霜降，白类资财中平相，装饰护法勤供养，天尊欢愉方吉祥。"},{"label":"行人","text":"出行之人须臾至，但有血腥争吵事，或许目的未达至，速速熏烟并祷祀，下午出门乃吉时。"},{"label":"经商","text":"经商之人遭重创。"},{"label":"行人","text":"若问行人可还乡，尚未归来羁他方，近处行人路未上。"},{"label":"丢失物品","text":"丢失物品之卦象，夕阳隐没之方向，附近红色断岩处，快速找寻莫延宕，否则若捞水月光。丢失细小物品相，落入昏暗之罗网，路遥找回不得方，或者被人带他乡。"},{"label":"转生","text":"若问降生于何处，多行杀生命债负，供养水灯做泥塔，布施乞丐穷人家，鱼狗蚂蚁等生灵，常行施舍不落空。否则堕入饿鬼中，蒙受饥渴之苦痛。需以巨大之善根，方能投胎得人身，修持正法具福分，普陀殊胜之山中，观音刹土中诞生，获得菩萨之胜果。"}]},{"n":6,"code":"hum","tib":"ཧཱུྃ","name":"坚固金刚","verse":"坚韧牢固之金刚，金刚岩石无迁变，乃为松赞干布卦。","blocks":[{"label":"缘起","text":"法王松赞干布尊，开创正法之初期，也即出现此卦象。天尊荫蔽高入云，若为壮年男子身，十三护法护佑勤。"},{"label":"修持正法","text":"修持正法之命运，无法不成极祥祯，尤其生圆次第法，证悟之日现光明。"},{"label":"家庭","text":"家庭卦象主太平，男士乘骑均上吉。"},{"label":"家庭·疾病","text":"儿童沾染凶煞气，妇女则主病患罹。"},{"label":"牲畜","text":"家豢牛羊等畜禽，及小牲畜有血腥，或有豺狼来袭击。"},{"label":"化解","text":"念诵十万莲师咒，具光佛母陀罗尼。"},{"label":"子嗣","text":"若问可否有子女，独苗一根血缘续。"},{"label":"疾病","text":"病痛折磨长时期，牛羊年生则主吉，狗龙生人稍凶祲，皆因前世之业力。"},{"label":"魔害","text":"或为日西之申时，中魔宾客前来至，手中执持着武器，带来昂贵之物具，患者自己身上越，彼为境魔纠缠地。东方发白之卯时，病灶由此而生起。或为黄昏之酉时，喧闹女人恶魔具，手持蓝色或黑色，水风泄露之物品，接受即会遭厄运。"},{"label":"化解","text":"长寿修法及灌顶，沐浴焚香做则利。药物疗法可对治，病期虽长但无咎。"},{"label":"寿命","text":"生命之卦无死相。"},{"label":"怨敌","text":"怨敌卦象敌忽降。"},{"label":"盗贼","text":"虽有盗贼但无妨。"},{"label":"行事","text":"若问行事之卦象，暂时拖延终能成。"},{"label":"出兵","text":"出兵打仗必延宕，怨敌若伏则吉祥。"},{"label":"追踪·诉讼","text":"追踪事宜可俘获，若有诉讼得胜果，暂时结果难定夺。"},{"label":"盗贼","text":"盗贼已潜至远方，设使寻找必落网。"},{"label":"请求·商榷","text":"请求之事得开许，商讨事宜主齐心。"},{"label":"庄稼","text":"若问田地之收成，五谷丰登仓满盈。"},{"label":"行人","text":"行人出门之卦象，稍有耽搁但无妨，傍晚出门则吉祥。"},{"label":"经商","text":"经商营贾己获胜，盈利丰厚财源滚。"},{"label":"行人","text":"回返行人速登门，倘若尚未进门槛，回程则必有拖延，终与挚友齐回还。若于近处须臾返。"},{"label":"丢失物品","text":"丢失物品之卦象，已到边远之地方，树木以及黑色处，自己寻找稍疲惫，听人口讯则能归。倘若丢失小物品，自己身边可找寻。"},{"label":"转生","text":"若问投生于何处，因贪他人之财物，害心焚毁自相续，与人争论及殴斗，需以禁食斋戒赎。精勤念颂普贤品，般若摄颂真实名，灌顶十万玛尼等，若不施行地狱生。若做彼等之善根，不难趣入解脱道。若为具戒出家僧，弃恶扬善精进行，密严刹土中诞生。"}]}]}

<script>
(function(){
  var P=new URLSearchParams(location.search);
  var n=+P.get("n")||1, q=(P.get("q")||"").trim();
  var G=null, i;

  /* 观音只需一个 1–6 的余数（六字真言六个音节），一数定一卦 */
  for (i=0;i<GUANYIN.guas.length;i++)
    if (GUANYIN.guas[i].n===n){ G=GUANYIN.guas[i]; break; }
  if (!G) G=GUANYIN.guas[0];

  var h="";
  if (q) h+='<p class="ask"><b>所问</b><span id="q"></span></p>';
  h+='<h1 class="nm">'+G.name+'<span class="ti">'+G.tib+'</span></h1>';
  h+='<p class="lead">'+G.verse+'</p>';
  G.blocks.forEach(function(b){
    h+='<p class="s"><b>'+b.label+'</b>：'+b.text+'</p>';
  });
  document.getElementById("out").innerHTML=h;

  /* 留一条记录：只存「回到这一卦的地址 + 卦名 + 所问 + 时间」，正文不复制一份。
     同一个地址只记一次 —— 刷新卦象页不该多出一条。用不了 localStorage 就静默跳过，
     记录不该妨碍看卦 */
  try{
    var U=location.pathname.split("/").pop()+location.search;
    var LOG=JSON.parse(localStorage.log||"[]");
    /* 同一地址全表只留一条：从记录页回看旧卦也会走到这里，
       只对比最新一条的话，每回看一次就多出一条重复记录 —— 挪到最前、刷新时间 */
    LOG=LOG.filter(function(x){ return x.u!==U; });
    LOG.unshift({t:Date.now(),k:"观音",u:U,n:G.name,q:q});
    localStorage.log=JSON.stringify(LOG.slice(0,100));
  }catch(e){}

  /* 所问是用户输入，只许走 textContent */
  if (q){
    document.getElementById("q").textContent=q;
    document.querySelector(".back").href="gycast.html?q="+encodeURIComponent(q);
  }
})();
</script>
